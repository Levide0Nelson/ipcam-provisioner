site_name: "Site Essai"
ip_range:
  start: 192.168.5.10
  end: 192.168.5.250
subnet_mask: 255.255.255.0
gateway: 192.168.5.1
vendors:
  hikvision:
    default_password: "admin123"
  dahua:
    default_password: "admin123"
  tiandy:
    default_password: "admin123"
  onvif:
    default_password: "admin123"
concurrency:
  max_parallel_requests: 50
discovery:
  timeout_seconds: 5
  methods: [sadp, dahua_discovery, tiandy_discovery, onvif_ws_discovery, arp_oui_fallback]
